<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="meta.title">MASTERKEY — производитель полиэтиленовой продукции</title>
<meta name="description" content="MASTERKEY — производитель полиэтиленовой продукции. Пакеты, плёнки и упаковочные материалы различных видов и размеров." data-i18n-attr="content" data-i18n="meta.desc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#006b35;
  --green2:#8bd400;
  --dark:#07351f;
  --yellow:#ffd91a;
  --light:#f3f7f2;
  --line:#dfe9e1;
  --text:#17231c;
  --muted:#5c6b61;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',Arial,sans-serif;color:var(--text);background:#f6f9f4;-webkit-font-smoothing:antialiased}
 
/* animated production-line background */
.factory-bg{position:fixed;inset:0;z-index:-2;overflow:hidden;opacity:.4;pointer-events:none}
.factory-bg svg{position:absolute;top:0;left:0}
.factory-machine{width:min(46vw,560px);top:8%;left:-2%}
.conveyor-wrap{position:absolute;left:0;right:0;bottom:6%;height:80px;overflow:hidden}
.conveyor-row{display:flex;align-items:center;gap:56px;width:max-content;animation:conveyorMove 26s linear infinite}
.conveyor-row svg{width:64px;height:64px;flex:none}
@keyframes conveyorMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.factory-bg{display:none}}
@media(max-width:700px){.factory-bg{opacity:.3}.factory-machine{display:none}}
h1,h2,h3{font-family:'Manrope',Arial,sans-serif}
.container{width:min(1160px,92%);margin:auto}
a{color:inherit}
 
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px;color:var(--dark)}
.brand-logo{height:38px;width:auto;display:block}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-links a{text-decoration:none;font-weight:600;font-size:15px;color:var(--dark)}
.nav-cta{background:var(--green);color:#fff !important;padding:10px 18px;border-radius:10px}
.burger{display:none;background:none;border:0;padding:8px;cursor:pointer}
.burger span{display:block;width:24px;height:2px;background:var(--dark);margin:5px 0;border-radius:2px}
 
/* language switcher */
.lang-switch{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang-btn{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.lang-btn.active{background:var(--dark);color:#fff}
 
/* hero */
.hero{background:rgba(255,255,255,.62);padding:64px 0 56px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:48px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--dark);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--green2)}
h1{font-size:clamp(34px,4.6vw,54px);line-height:1.08;margin:18px 0 16px;color:var(--dark);font-weight:800;max-width:17ch}
.hero p{font-size:18px;line-height:1.55;max-width:560px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:11px;text-decoration:none;font-weight:700;font-size:15px;margin:8px 10px 0 0;border:0;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--green);color:#fff}
.btn-secondary{background:var(--yellow);color:#1c2500}
 
.stats{display:flex;gap:32px;margin-top:36px;flex-wrap:wrap}
.stat b{display:block;font-size:28px;color:var(--dark);font-family:'Manrope',sans-serif}
.stat span{font-size:13px;color:var(--muted)}
 
.hero-art{position:relative;height:380px;display:flex;align-items:center;justify-content:center}
.hero-art img{max-width:100%;max-height:100%;object-fit:contain}
 
/* sections */
section{padding:64px 0}
.section-head{max-width:640px;margin:0 auto 36px}
.eyebrow{color:var(--green);font-weight:700;font-size:14px;margin:0 0 6px}
.section-title{font-size:32px;margin:0 0 10px;color:var(--dark)}
.section-title.center{text-align:center;margin-left:auto;margin-right:auto}
.section-sub{color:var(--muted);line-height:1.5;margin:0}
.center-wrap{text-align:center}
 
/* features */
.features{background:rgba(243,247,242,.86)}
#catalog{background:rgba(255,255,255,.78)}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.feat-icon{width:44px;height:44px;border-radius:10px;background:#e9f6ea;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.feat h3{margin:0 0 6px;font-size:17px;color:var(--dark)}
.feat p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
 
/* catalog */
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.filter-btn{background:#fff;border:1px solid var(--line);color:var(--dark);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s ease}
.filter-btn.active{background:var(--dark);border-color:var(--dark);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid[hidden]{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:visible;display:flex;flex-direction:column;transition:box-shadow .2s ease, transform .2s ease;opacity:0;transform:translateY(14px) scale(.98);animation:cardIn .38s ease forwards}
.card:hover{box-shadow:0 12px 28px rgba(7,53,31,.1);transform:translateY(-3px)}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){.card{animation:none;opacity:1;transform:none}}
.card-visual{aspect-ratio:1.7/1;background:linear-gradient(135deg,#eef8e6,#f7fbf4);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:16px 16px 0 0}
.card-visual img{width:100%;height:100%;object-fit:cover}
.card-body{padding:18px 20px 20px;position:relative}
.card h3{margin:0 0 6px;font-size:17px;color:var(--dark)}
.spec{color:var(--muted);margin-bottom:14px;font-size:14px}
.card .btn{width:100%;justify-content:center;margin:0;padding:11px}
 
/* price dropdown */
.price-dd{position:relative}
.price-dd-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 32px rgba(7,53,31,.16);padding:6px;display:none;flex-direction:column;gap:2px;z-index:5}
.price-dd.open .price-dd-menu{display:flex}
.price-dd-item{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--dark);cursor:pointer}
.price-dd-item:hover{background:var(--light)}
 
/* contacts */
.contact{background:var(--dark);color:#fff}
.contact .section-title,.contact .eyebrow{color:#fff}
.contact .section-sub{color:#c7d8cc}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;margin:0 auto}
.contact-card{background:#fff;color:var(--text);padding:24px;border-radius:16px}
.contact-card h3{margin-top:0;color:var(--green);font-size:16px}
.contact-card a{color:var(--dark);font-weight:800;text-decoration:none;display:block;margin-bottom:6px}
 
footer{background:#042416;color:#9fb3a6;text-align:center;padding:22px;font-size:14px}
 
/* floating tg button */
.float-tg{position:fixed;bottom:22px;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--green);color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,107,53,.35);text-decoration:none;z-index:40}
.float-tg svg{width:26px;height:26px}
 
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(7,53,31,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;color:var(--dark);font-size:19px}
.modal .modal-product{color:var(--muted);font-size:14px;margin:0 0 18px}
.modal label{display:block;font-size:13px;font-weight:700;color:var(--dark);margin:14px 0 6px}
.modal input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
.modal input:focus{outline:2px solid var(--green2);outline-offset:1px}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{margin:0;flex:1;justify-content:center}
.modal-cancel{background:var(--light);color:var(--dark)}
.modal-error{color:#c0392b;font-size:13px;margin-top:10px;display:none}
.modal-error.show{display:block}
 
@media(max-width:900px){
  .feat-grid{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:800px){
  .nav-links{position:fixed;top:74px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;padding:16px 6%;gap:16px;transform:translateY(-130%);transition:transform .25s ease}
  .nav-links.open{transform:translateY(0)}
  .burger{display:block}
  .hero-grid{grid-template-columns:1fr;text-align:center}
  .hero p{margin-left:auto;margin-right:auto}
  .stats{justify-content:center}
  .hero-art{height:260px;order:-1}
  .contact-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .feat-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  section{padding:48px 0}
}
</style>

const SALES_HANDLE = 'MirAs_menedjer';
const EXCHANGE_HANDLE = 'menedjer_otdela_prodaj';
 
function getLang(){
  return localStorage.getItem('mk_lang') || 'ru';
}
 
function t(key, lang){
  lang = lang || getLang();
  const dict = I18N[lang] || I18N.ru;
  return dict[key] !== undefined ? dict[key] : (I18N.ru[key] || key);
}
 
function applyLanguage(lang){
  document.documentElement.lang = lang;
  localStorage.setItem('mk_lang', lang);
 
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key, lang);
    if(el.hasAttribute('data-i18n-attr')){
      el.setAttribute(el.getAttribute('data-i18n-attr'), val);
    } else {
      el.textContent = val;
    }
  });
 
  document.querySelectorAll('[data-i18n-alt]').forEach(el => {
    el.alt = t(el.getAttribute('data-i18n-alt'), lang);
  });
 
  document.getElementById('lotField1').placeholder = t('modal.field1Ph', lang);
  document.getElementById('lotField2').placeholder = t('modal.field2Ph', lang);
 
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}
 
document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});
 
applyLanguage(getLang());
 
/* mobile menu */
document.getElementById('burger').addEventListener('click',()=>{
  document.getElementById('navLinks').classList.toggle('open');
});
document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{
  document.getElementById('navLinks').classList.remove('open');
}));
 
/* catalog filters */
const buttons=document.querySelectorAll('.filter-btn');
const cards=document.querySelectorAll('#productGrid .card');
const grid=document.getElementById('productGrid');
const hint=document.getElementById('catalogHint');
 
buttons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f=btn.dataset.filter;
 
    grid.hidden=false;
    hint.style.display='none';
 
    let visibleIndex=0;
    cards.forEach(c=>{
      const show=(f==='all'||c.dataset.cat===f);
      c.style.display=show?'flex':'none';
      if(show){
        c.style.animation='none';
        void c.offsetWidth;
        c.style.animationDelay=(visibleIndex*45)+'ms';
        c.style.animation='';
        visibleIndex++;
      }
    });
 
    grid.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
});
 
/* price dropdowns */
let openDd = null;
document.querySelectorAll('.price-dd-toggle').forEach(btn=>{
  btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const dd = btn.closest('.price-dd');
    const wasOpen = dd.classList.contains('open');
    if(openDd && openDd!==dd) openDd.classList.remove('open');
    dd.classList.toggle('open', !wasOpen);
    openDd = dd.classList.contains('open') ? dd : null;
  });
});
document.addEventListener('click', ()=>{
  if(openDd){ openDd.classList.remove('open'); openDd=null; }
});
 
function productByKey(key){
  return PRODUCTS.find(p => p.key === key);
}
 
document.querySelectorAll('.price-dd-item').forEach(item=>{
  item.addEventListener('click',(e)=>{
    e.stopPropagation();
    const card = item.closest('.card');
    const dd = item.closest('.price-dd');
    dd.classList.remove('open');
    openDd = null;
    const lang = getLang();
    const key = card.dataset.product;
    const product = productByKey(key);
    const productName = product ? product.name[lang] : card.querySelector('h3').textContent;
 
    if(item.dataset.action === 'wholesale'){
      const text = t('msg.wholesaleGreeting', lang).replace('{product}', productName);
      window.open('https://t.me/' + SALES_HANDLE + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    } else {
      openLotModal(productName);
    }
  });
});

const lotModal = document.getElementById('lotModal');
const lotForm = document.getElementById('lotForm');
const lotField1 = document.getElementById('lotField1');
const lotField2 = document.getElementById('lotField2');
const lotError = document.getElementById('lotError');
const lotModalProduct = document.getElementById('lotModalProduct');
let currentLotProduct = '';
 
function openLotModal(productName){
  currentLotProduct = productName;
  lotModalProduct.textContent = productName;
  lotField1.value = '';
  lotField2.value = '';
  lotError.classList.remove('show');
  lotModal.classList.add('open');
  setTimeout(()=>lotField1.focus(), 50);
}
function closeLotModal(){
  lotModal.classList.remove('open');
}
document.getElementById('lotCancel').addEventListener('click', closeLotModal);
lotModal.addEventListener('click', (e)=>{ if(e.target===lotModal) closeLotModal(); });
 
lotForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const v1 = lotField1.value.trim();
  const v2 = lotField2.value.trim();
  if(!v1 || !v2){
    lotError.classList.add('show');
    return;
  }
  lotError.classList.remove('show');
  const lang = getLang();
  const lines = [
    t('msg.lotGreeting', lang),
    t('msg.lotProduct', lang) + ': ' + currentLotProduct,
    t('msg.lotCompany', lang) + ': ' + v1,
    t('msg.lotRegion', lang) + ': ' + v2
  ];
  const text = lines.join('\n');
  closeLotModal();
  window.open('https://t.me/' + EXCHANGE_HANDLE + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
});
</script>
</body>
</html>
